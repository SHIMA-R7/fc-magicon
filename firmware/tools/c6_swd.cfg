# OpenOCD configuration for the C6 SWD bridge on the trusted local LAN.
adapter driver remote_bitbang
if {![info exists C6_HOST]} { set C6_HOST fc-magicon.local }
remote_bitbang host $C6_HOST
if {![info exists C6_PORT]} { set C6_PORT 5001 }
remote_bitbang port $C6_PORT
transport select swd
adapter speed 100
reset_config none
set SWD_MULTIDROP 1
source [find target/rp2350.cfg]
